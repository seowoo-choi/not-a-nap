<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#06101d">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" tabindex="-1" aria-label="NOT A NAP 게임 화면"></canvas>
      <section id="unity-loading-bar" aria-live="polite">
        <div id="loading-title">NOT A NAP</div>
        <div id="loading-copy">게임을 불러오는 중입니다. 잠시만 기다려 주세요.</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </section>
      <div id="unity-warning" role="status"></div>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const container = document.querySelector("#unity-container");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBar = document.querySelector("#unity-progress-bar-full");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        const item = document.createElement("div");
        item.textContent = message;
        item.className = type === "error" ? "warning error" : "warning";
        warningBanner.appendChild(item);
        if (type !== "error") setTimeout(() => item.remove(), 5000);
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      function fitCanvas() {
        const viewport = window.visualViewport;
        const width = Math.max(320, Math.round(viewport ? viewport.width : window.innerWidth));
        const height = Math.max(480, Math.round(viewport ? viewport.height : window.innerHeight));
        container.style.width = width + "px";
        container.style.height = height + "px";
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
      }

      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.visualViewport?.addEventListener("resize", fitCanvas);
      canvas.addEventListener("pointerdown", () => canvas.focus());

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, progress => {
          progressBar.style.width = (progress * 100) + "%";
        }).then(() => {
          loadingBar.remove();
          canvas.focus();
        }).catch(message => {
          loadingBar.remove();
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
