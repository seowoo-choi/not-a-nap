name: Build and deploy WebGL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-WebGL-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildMethod: NotANap.Editor.WebBuildCommand.Build
          customParameters: -outputPath Builds/WebGL

      # game-ci builds inside Docker, so its output can be owned by root.
      - name: Fix build output permissions
        run: sudo chown -R "$(id -u):$(id -g)" Builds/WebGL

      - name: Prepare Pages artifact
        shell: bash
        run: |
          test -f Builds/WebGL/index.html
          # A stale index mixed with another build used to request missing
          # loader/data/wasm files. Verify the complete generated set before
          # upload. The filenames are read from the index instead of hardcoded
          # because compression settings change them (Brotli + decompression
          # fallback appends .unityweb, plain Brotli appends .br).
          # `|| true` keeps a no-match grep (exit 1) from tripping errexit/pipefail
          # before the explicit checks below can report what is actually wrong.
          build_files=$(
            { grep -oE 'buildUrl \+ "/[^"]+"' Builds/WebGL/index.html || true; } |
              sed -E 's|.*"/(.*)"|\1|' | sort -u
          )
          build_file_count=$(printf '%s\n' "$build_files" | grep -c . || true)
          if [ "$build_file_count" -lt 4 ]; then
            echo "Expected at least 4 Build/ references in index.html, found $build_file_count"
            printf '  %s\n' "$build_files"
            exit 1
          fi
          while IFS= read -r file; do
            test -f "Builds/WebGL/Build/$file" || {
              echo "Missing WebGL artifact referenced by the generated build: Build/$file"
              exit 1
            }
          done <<< "$build_files"
          # Unity reuses stable WebGL filenames between deployments. Without a
          # version query, a browser can combine an older data/wasm response
          # with the latest index and leave the canvas blank after navigation.
          perl -0pi -e 's/(buildUrl \+ "\/[^"]+)"/$1?v=$ENV{GITHUB_SHA}"/g' Builds/WebGL/index.html
          versioned=$(grep -o -F "?v=${GITHUB_SHA}" Builds/WebGL/index.html | wc -l)
          if [ "$versioned" -lt "$build_file_count" ]; then
            echo "Cache-busting query missing: versioned $versioned of $build_file_count Build/ references"
            exit 1
          fi
          touch Builds/WebGL/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
